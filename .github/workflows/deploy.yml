name: Flask Lab CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Lint and Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Tofu Init
        run: tofu init

      - name: Tofu Format Check
        run: tofu fmt -check

      - name: Tofu Validate
        run: tofu validate

  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        run: tofu plan

  apply:
    name: Tofu Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub

      - name: Tofu Init
        run: tofu init

      - name: Tofu Apply
        run: tofu apply -auto-approve