name: Flask Lab CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Lint and Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Tofu Init
        run: tofu init

      - name: Tofu Format Check
        run: tofu fmt -check

      - name: Tofu Validate
        run: tofu validate

  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        run: tofu plan

  apply:
    name: Tofu Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Tofu Init
        run: tofu init

      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub

      - name: Tofu Apply
        run: tofu apply -auto-approve

  deploy-app:
    name: Deploy app.py to EC2
    runs-on: ubuntu-latest
    needs: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::347948520061:role/GitHubOIDC-TerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=grc-flask-lab-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Copy app.py to EC2
        run: |
          scp -o StrictHostKeyChecking=no app.py \
          ec2-user@${{ steps.get-ip.outputs.ec2_ip }}:/home/ec2-user/flask-app/app.py

      - name: Restart Flask service
        run: |
          ssh -o StrictHostKeyChecking=no \
          ec2-user@${{ steps.get-ip.outputs.ec2_ip }} \
          "sudo systemctl restart flask-app"
